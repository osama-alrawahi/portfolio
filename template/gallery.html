<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Osama Al-Rawahi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../static/tailwind.config.js"></script>
  <link rel="stylesheet" href="../static/style.css">
</head>

<body class="font-sans text-gray-300 antialiased overflow-x-hidden" data-root="../" data-page="gallery">

  <main class="pt-28 pb-10">
    <section class="container mx-auto px-6">
      <div class="max-w-7xl mx-auto">
        <header class="text-center mb-10">
          <div class="pill mb-3"><span class="animate-pulse">●</span> Portfolio / Gallery</div>
          <h1 class="text-4xl md:text-5xl font-bold text-white">Visual Journey <span class="text-space-accent">/</span> Gallery</h1>
          <p class="mt-3 text-gray-400">Photos from projects, competitions, workshops and events.</p>
        </header>

        <div class="glass tech-border rounded-2xl p-5 md:p-6 mb-8">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
            <div class="md:col-span-6">
              <label for="searchInput" class="label">Search</label>
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input id="searchInput" type="search" placeholder="Title or description" class="field field-with-icon">
              </div>
            </div>
            <div class="md:col-span-3">
              <label for="categorySelect" class="label">Category</label>
              <select id="categorySelect" class="field"></select>
            </div>
            <div class="md:col-span-3">
              <button id="clearBtn" type="button" class="btn btn-ghost w-full">Clear filters</button>
            </div>
            <div class="md:col-span-12 pt-2 border-t border-gray-800">
              <span id="resultCount" class="text-sm font-mono text-space-accent bg-space-accent/10 px-3 py-1 rounded-full" aria-live="polite">0 images</span>
            </div>
          </div>
        </div>

        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <div id="emptyState" class="hidden glass tech-border rounded-2xl p-8 mt-6 text-center">
          <i class="fa-solid fa-images text-3xl text-space-accent mb-3"></i>
          <h2 id="emptyTitle" class="text-xl font-bold text-white">No images match these filters</h2>
          <p id="emptyText" class="text-gray-400 mt-1 mb-4">Pick another category or change the search text.</p>
          <button type="button" class="btn btn-outline btn-sm" data-clear-filters>Clear filters</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Photo viewer -->
  <div id="photoModal" class="modal" aria-labelledby="phTitle">
    <div class="modal-panel max-w-5xl p-4 md:p-5">
      <div class="flex justify-end mb-2">
        <button type="button" class="icon-btn text-2xl" data-close-modal aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="phImage"></div>
      <div class="mt-4 text-center">
        <h2 id="phTitle" class="text-2xl font-bold text-white"></h2>
        <p id="phCategory" class="text-space-accent text-sm mt-1"></p>
        <p id="phDescription" class="text-gray-400 text-sm mt-2"></p>
        <p id="phDate" class="text-gray-500 text-xs mt-1 font-mono"></p>
      </div>
    </div>
  </div>

  <script src="../data/gallery.js"></script>
  <script src="../static/utils.js"></script>
  <script src="../static/pages/gallery.js"></script>
</body>
</html>
